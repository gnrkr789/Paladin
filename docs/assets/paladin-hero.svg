<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Paladin</title>
  <desc id="desc">Animated banner: a shield scans agent-written code and an observed risky Mercurial argument becomes a protected one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#151c3a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa6ff"/>
      <stop offset="1" stop-color="#3451d1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c9cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="panel"><rect width="760" height="124" rx="14"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(0.92); } 50% { opacity: 0.95; transform: scale(1.08); } }
      .glow { transform-origin: 200px 195px; animation: pulse 3.2s ease-in-out infinite; }
      @keyframes draw { 0%, 20% { stroke-dashoffset: 120; } 45%, 100% { stroke-dashoffset: 0; } }
      .check { stroke-dasharray: 120; animation: draw 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-120px); } 100% { transform: translateX(760px); } }
      .beam { animation: sweep 2.5s linear infinite; }
      @keyframes risk { 0%, 42% { opacity: 1; } 52%, 100% { opacity: 0; } }
      @keyframes safe { 0%, 42% { opacity: 0; } 52%, 100% { opacity: 1; } }
      .risk { animation: risk 5s ease-in-out infinite; }
      .safe { animation: safe 5s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .live { animation: blink 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>

  <circle class="glow" cx="200" cy="195" r="135" fill="url(#glow)"/>
  <path d="M200 78 L292 114 V196 C292 258 252 298 200 318 C148 298 108 258 108 196 V114 Z"
        fill="url(#shield)" stroke="#c7d3ff" stroke-width="3"/>
  <path d="M200 98 L274 127 V196 C274 246 242 280 200 297 Z" fill="#ffffff" fill-opacity="0.08"/>
  <path class="check" d="M160 198 L190 228 L244 168" fill="none" stroke="#ffffff"
        stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="380" y="140" class="sans" font-size="76" font-weight="800" letter-spacing="8" fill="#ffffff">PALADIN</text>
  <text x="383" y="184" class="sans" font-size="24" fill="#aab6e0">CVE-grounded prevention and proof for AI coding agents</text>

  <g transform="translate(380 214)">
    <rect width="760" height="124" rx="14" fill="#0d1328" stroke="#2a3566"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5" fill="#febc2e"/>
    <circle cx="58" cy="20" r="5" fill="#28c840"/>
    <text x="84" y="25" class="mono" font-size="13" fill="#6d79a8">cookiecutter/vcs.py  -  observed in an isolated container</text>
    <g class="mono" font-size="18">
      <text class="risk" x="24" y="66" fill="#ff8a8a">check_output([repo_type, "checkout", checkout])</text>
      <text class="safe" x="24" y="66" fill="#8ff0b4">check_output([repo_type, "checkout", "--", checkout])</text>
      <text class="risk" x="24" y="100" font-size="15" fill="#ff8a8a">execve /usr/bin/hg ["hg", "checkout", "--config=alias.checkout=x"]  risk exposed</text>
      <text class="safe" x="24" y="100" font-size="15" fill="#8ff0b4">execve /usr/bin/hg ["hg", "checkout", "--", "--config=..."]  risk blocked</text>
    </g>
    <circle class="live" cx="736" cy="20" r="5" fill="#7c9cff"/>
    <g clip-path="url(#panel)">
      <rect class="beam" x="0" y="0" width="120" height="124" fill="url(#beam)"/>
    </g>
  </g>
</svg>
