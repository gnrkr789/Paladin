[project]
name = "paladin"
version = "0.2.0a1"
description = "Evidence-grounded vulnerability prevention for coding agents"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp==2.3.0",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "packaging>=24",
    "pymilvus==2.6.17",
    "tokenizers>=0.21,<1",
]

[project.scripts]
paladin = "paladin.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paladin", "paladin_evidence"]
# Evidence copies (CVE records, advisories, upstream patches for verified cards) ship as their
# own package so excerpts work in every project and install, not only in this checkout.
package-dir = {"paladin" = "src/paladin", "paladin_evidence" = "data"}

[tool.setuptools.package-data]
paladin = ["resources/*.yaml", "resources/*.json", "resources/sandbox/*"]
paladin_evidence = ["THIRD_PARTY.md", "m0/sources/*", "m2/sources/*", "cve-expansion/sources/*"]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "jsonschema>=4.23,<5",
]

[tool.uv]
package = true
